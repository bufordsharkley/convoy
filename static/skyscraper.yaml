     description: >
       Begin from orbit, then descend! The Earful Gang is back for its new
       series, and it's a whale of a tale, all about a little building that
       could. But we're not there yet‒in today's episode, we spend some in time
       in Ash Lake, Minnesota, home of a sheer rock cliff and white
       annihilation. The Rock is on HRT: will he stop the bloodshed? Or will his big
       head get blown up? And will text loom improbably over a tower? Tune in to
       find out! Featuring the popular new segments "Sky Spoilers", "One More
       Floor", "Floor Check", and "Skyscraper in the Air"!
